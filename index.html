<meta name="twitter:image" content="https://chronosandink.github.io/chronos-and-ink-site/logo.png">

<!-- Favicon & PWA / App Icons -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#122347">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chronos & Ink">

<!-- Web App Manifest for "Add as App" -->
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Chronos%20%26%20Ink%22%2C%22short_name%22%3A%22Chronos%20%26%20Ink%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23122347%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22logo.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --surface: #ffffff;
    --surface-soft: #f8f9fa;
    --ink: #122347;
    --muted: #647393;
    --line: #e1d8ca;
    --rose: #b54a4e;
    --emerald: #16a34a;
    --purple: #7c3aed;
    --orange: #ea580c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 20px);
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; background: none; border: none; }

  .page { max-width: 1200px; margin: 0 auto; padding: 0 40px; position: relative; }
  
  .topbar {
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    gap: 24px;
    position: relative;
    z-index: 100;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
  }
  .brand-logo-img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    flex-shrink: 0;
    transition: transform 0.3s ease;
  }
  .brand:hover .brand-logo-img {
    transform: rotate(-5deg) scale(1.05);
  }
  .brand-name {
    display: block;
    font-family: Fraunces, serif;
    font-size: 26px;
    line-height: 1;
    font-weight: 500;
  }
  .brand-line {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav button {
    border: 1px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    padding: 10px 18px;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    transition: all .25s ease;
  }
  .nav button:hover,
  .nav button.active {
    background: var(--ink);
    color: var(--surface);
  }

  .menu-toggle {
    display: none;
    cursor: pointer;
    padding: 8px;
    z-index: 110;
  }
  .menu-toggle svg {
    width: 28px;
    height: 28px;
    fill: var(--ink);
  }

  main { 
    padding: 64px 0 120px; 
    padding-bottom: calc(120px + env(safe-area-inset-bottom, 20px));
  }
  
  .view-animate {
    animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero {
    margin-bottom: 80px;
    padding: 40px 0;
  }
  h1, h2, h3 { margin: 0; font-weight: 400; }
  h1 {
    font-family: Fraunces, serif;
    font-size: clamp(42px, 6.5vw, 76px);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .lead {
    max-width: 680px;
    margin: 24px 0 0;
    color: var(--muted);
    font-size: 19px;
    line-height: 1.7;
  }
  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 36px;
  }
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    padding: 0 24px;
    background: var(--ink);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .button.secondary {
    background: transparent;
    color: var(--ink);
    border-color: var(--ink);
  }
  .button:hover { 
    transform: translateY(-2px); 
    box-shadow: 0 8px 20px rgba(18, 35, 71, 0.12);
  }

  .section-head {
    border-bottom: 1px solid var(--line);
    padding-bottom: 24px;
    margin-bottom: 48px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 40px;
  }
  .section-head h2 {
    font-family: Fraunces, serif;
    font-size: clamp(32px, 4.5vw, 48px);
    letter-spacing: -0.01em;
  }
  .section-head p {
    margin: 10px 0 0;
    max-width: 600px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
  }
  .count {
    white-space: nowrap;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  /* Subsection Header Styling */
  .subsection-header {
    margin-top: 32px;
    margin-bottom: 28px;
    padding-left: 18px;
    border-left: 4px solid var(--ink);
  }
  .subsection-title {
    font-family: Fraunces, serif;
    font-size: clamp(26px, 3.2vw, 34px);
    line-height: 1.2;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .subsection-intro {
    color: var(--muted);
    font-size: 16px;
    margin-top: 8px;
    line-height: 1.6;
    max-width: 720px;
  }

  .collection-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 36px;
    margin-bottom: 84px;
  }
  .editorial-spread {
    display: flex;
    flex-direction: column;
    text-align: left;
    position: relative;
    padding-top: 20px;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .spread-num {
    font-family: Fraunces, serif;
    font-size: 54px;
    line-height: 1;
    color: var(--ink);
    opacity: 0.15;
    margin-bottom: 12px;
    font-weight: 500;
    transition: opacity 0.3s ease, transform 0.3s ease;
    transform-origin: left bottom;
  }
  .spread-title-wrap {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
  }
  .spread-accent {
    width: 4px;
    height: 28px;
    border-radius: 2px;
    flex-shrink: 0;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .editorial-spread h3 {
    font-family: Fraunces, serif;
    font-size: 26px;
    line-height: 1.1;
    color: var(--ink);
  }
  .editorial-spread p {
    margin: 16px 0 24px;
    color: var(--muted);
    line-height: 1.65;
    font-size: 14px;
    flex-grow: 1;
  }
  .editorial-link {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 4px;
    align-self: flex-start;
    transition: gap 0.2s ease;
  }
  
  .editorial-spread:hover { transform: translateY(-4px); }
  .editorial-spread:hover .spread-num { opacity: 0.28; transform: scale(1.05); }
  .editorial-spread:hover .spread-accent { transform: scaleY(1.25); }
  .editorial-spread:hover .editorial-link { gap: 10px; }

  .shelf-layout {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    gap: 40px;
  }
  .filter-panel {
    position: sticky;
    top: 40px;
    align-self: start;
  }
  .filter-panel h2 {
    font-family: Fraunces, serif;
    font-size: 28px;
    margin-bottom: 20px;
  }
  .filter-panel button {
    width: 100%;
    margin-top: 6px;
    padding: 10px 0;
    text-align: left;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    border-bottom: 1px solid transparent;
    transition: all 0.2s ease;
  }
  .filter-panel button.active,
  .filter-panel button:hover {
    color: var(--ink);
    border-bottom-color: var(--ink);
    padding-left: 6px;
  }
  
  /* WEB 4-IN-A-ROW GRID SYSTEM FOR BOOKS */
  .books-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 24px;
    margin-bottom: 32px;
  }
  
  /* SHELF VIEW WITH SIDEBAR: ADJUST TO 3 COLS FOR PERFECT PROPORTIONS */
  .shelf-layout .books-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  
  .book-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface-soft);
    position: relative;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease;
  }
  
  .book-card:hover {
    border-color: var(--ink);
    box-shadow: 0 12px 24px rgba(18, 35, 71, 0.06);
    transform: translateY(-5px);
  }
  
  .book-card-indicator {
    position: absolute;
    top: 0;
    left: 20px;
    right: 20px;
    height: 4px;
    border-radius: 0 0 4px 4px;
  }
  
  .book-cover-container-fixed {
    width: 100%;
    height: 220px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 12px 0 16px;
    position: relative;
  }
  
  .book-cover-thumb {
    max-width: 100%;
    max-height: 100%;
    filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.15));
    transition: transform 0.2s ease;
  }
  
  .book-card:hover .book-cover-thumb {
    transform: scale(1.03);
  }
  
  .book-main { 
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    margin-bottom: 20px;
  }
  
  .book-card h3 {
    margin: 6px 0 8px;
    font-family: Fraunces, serif;
    font-size: 19px;
    line-height: 1.25;
    color: var(--ink);
  }
  
  .book-card .meta {
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  
  .book-card p {
    color: var(--muted);
    line-height: 1.5;
    font-size: 13px;
    margin-top: 4px;
  }

  .featured-showcase-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 24px;
  }
  .showcase-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface-soft);
    position: relative;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .showcase-card:hover {
    border-color: var(--ink);
    box-shadow: 0 12px 24px rgba(18, 35, 71, 0.06);
    transform: translateY(-6px);
  }
  .showcase-badge {
    position: absolute;
    top: -12px;
    left: 20px;
    background: #ffffff;
    border: 1px solid var(--line);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .showcase-cover-wrapper {
    width: 100%;
    height: 220px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 12px auto 16px;
    position: relative;
  }
  
  .showcase-cover-img {
    max-width: 100%;
    max-height: 100%;
    filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.18));
  }
  
  .showcase-card h3 {
    font-family: Fraunces, serif;
    font-size: 19px;
    line-height: 1.25;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .showcase-card p {
    margin: 0 0 20px 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    flex-grow: 1;
  }

  .buy {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    width: 100%;
    min-height: 42px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    padding: 0 16px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
  }
  .buy:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(18, 35, 71, 0.15);
  }

  .detail-hero {
    border-bottom: 1px solid var(--line);
    padding-bottom: 40px;
    margin-bottom: 48px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 24px;
    align-items: end;
  }
  .back {
    display: inline-flex;
    margin-bottom: 32px;
    color: var(--muted);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .back:hover { color: var(--ink); transform: translateX(-3px); }

  /* App Install Smart Banner */
  .pwa-banner {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    right: 20px;
    left: 20px;
    max-width: 420px;
    margin-left: auto;
    background: var(--ink);
    color: #fff;
    padding: 16px 20px;
    border-radius: 16px;
    box-shadow: 0 16px 36px rgba(18, 35, 71, 0.3);
    display: none;
    align-items: center;
    gap: 16px;
    z-index: 1000;
    animation: fadeInUp 0.4s ease forwards;
  }
  .pwa-banner img {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    object-fit: contain;
  }
  .pwa-banner .pwa-info {
    flex-grow: 1;
  }
  .pwa-banner .pwa-title {
    font-weight: 600;
    font-size: 14px;
  }
  .pwa-banner .pwa-sub {
    font-size: 12px;
    color: #d1d9e6;
    margin-top: 2px;
  }
  .pwa-banner .pwa-btn {
    background: #fff;
    color: var(--ink);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .pwa-banner .pwa-close {
    color: #fff;
    opacity: 0.6;
    cursor: pointer;
    font-size: 18px;
    padding: 4px;
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 40px 0 calc(40px + env(safe-area-inset-bottom, 0px));
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    margin-top: 60px;
  }

  /* RESPONSIVE LAYOUTS */
  @media (max-width: 1120px) {
    .books-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .shelf-layout .books-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  
  @media (max-width: 1024px) {
    .collection-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px; }
    .featured-showcase-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .books-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  }
  
  @media (max-width: 840px) {
    .page { padding: 0 24px; }
    .menu-toggle { display: block; }
    
    .nav {
      position: fixed;
      top: 0;
      right: -100%;
      width: 280px;
      height: 100vh;
      height: 100dvh;
      background: var(--surface);
      border-left: 1px solid var(--line);
      box-shadow: -10px 0 30px rgba(0,0,0,0.05);
      flex-direction: column;
      align-items: flex-start;
      padding: 120px 24px 40px;
      gap: 12px;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 95;
      border-radius: 0;
    }
    .nav.open { right: 0; }
    .nav button { width: 100%; text-align: left; border-radius: 8px; padding: 14px 20px; font-size: 16px; }
    
    .collection-grid { grid-template-columns: 1fr; gap: 40px; }
    .featured-showcase-grid { grid-template-columns: 1fr; gap: 24px; }
    .shelf-layout { grid-template-columns: 1fr; gap: 32px; }
    .filter-panel { position: static; }
    
    /* MOBILE STACK: 1 BOOK CARD PER LINE */
    .books-grid { grid-template-columns: 1fr; gap: 20px; }
    .shelf-layout .books-grid { grid-template-columns: 1fr; }
    .detail-hero { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand" onclick="navigate('home')" role="button" tabindex="0" aria-label="Go home">
      <img class="brand-logo-img" src="logo.png" alt="Chronos & Ink Logo">
      <div>
        <span class="brand-name">Chronos & Ink</span>
        <span class="brand-line">write · preserve · inspire</span>
      </div>
    </div>
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle navigation menu">
      <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <nav class="nav" id="mainNav" aria-label="Primary">
      <button data-nav="home" onclick="handleNav('home')">Home</button>
      <button data-nav="shelf" onclick="handleNav('shelf')">Shelf</button>
      <button data-nav="romance" onclick="handleNav('romance')">Romance</button>
      <button data-nav="indian" onclick="handleNav('indian')">Indian</button>
      <button data-nav="selfhelp" onclick="handleNav('selfhelp')">Self Help</button>
      <button data-nav="diaries" onclick="handleNav('diaries')">Diaries</button>
    </nav>
  </header>

  <main id="view" class="view-animate"></main>

  <footer>&copy; Chronos & Ink. Beautifully bound reading editions and structured archives.</footer>
</div>

<!-- App Install Smart Banner -->
<div id="pwaBanner" class="pwa-banner">
  <img src="logo.png" alt="App Icon">
  <div class="pwa-info">
    <div class="pwa-title">Chronos & Ink App</div>
    <div class="pwa-sub">Add to your home screen</div>
  </div>
  <button class="pwa-btn" id="pwaInstallBtn" onclick="installPWA()">Install</button>
  <button class="pwa-close" onclick="closePwaBanner()">✕</button>
</div>

<script>
const DATA = {
  romance: {
    title: "Romance",
    intro: "A connected world of collision, distance, and choosing what lasts.",
    colorA: "#d97d81",
    colorB: "#b54a4e",
    subsections: [
      {
        title: "When We Romance Trilogy",
        intro: "A connected romance series about collision, distance, and choosing what lasts.",
        books: [
          { title: "When We First Collided", link: "https://kdpbook.link/for/B0GDV7C3ZS", vol: "Vol. I", blurb: "Book 1 of Romance Trilogy – When We", image: "images/WhenWeFirstCollided.jpg" },
          { title: "When We Drifted Apart", link: "https://kdpbook.link/for/B0GRWZ4651", vol: "Vol. II", blurb: "Book 2 of Romance Trilogy – When We", image: "images/WhenWeDriftedApart.jpg" },
          { title: "When We Choose Forever", link: "https://kdpbook.link/for/B0H58KDSPF", vol: "Vol. III", blurb: "Book 3 of Romance Trilogy - WhenWe", image: "images/WhenWeChooseFirever.jpg" }
        ]
      }
    ]
  },
  indian: {

const view = document.getElementById("view");
const nav = document.getElementById("mainNav");

function toggleMenu() { nav.classList.toggle("open"); }
function handleNav(route) { nav.classList.remove("open"); navigate(route); }
function navigate(route) { location.hash = "#/" + (route === "shelf" ? "shelf" : route === "home" ? "" : route); }

function setActive(route) {
  document.querySelectorAll("[data-nav]").forEach(button => {
    button.classList.toggle("active", button.dataset.nav === route || (route === "home" && button.dataset.nav === "home"));
  });
}

function triggerViewRefresh() {
  view.classList.remove("view-animate");
  void view.offsetWidth; 
  view.classList.add("view-animate");
}

function bookRow(book, collection, subsection) {
  const blurb = book.blurb || "A clean structured workspace for plans, milestones, and personal focus.";
  const label = book.vol || book.subtitle || (subsection && subsection.title ? subsection.title : "");
  const coverSrc = book.image || "logo.png";
  return `
    <article class="book-card">
      <div class="book-card-indicator" style="background: linear-gradient(90deg, ${collection.colorA}, ${collection.colorB})" aria-hidden="true"></div>
      <div class="book-cover-container-fixed">
        <img class="book-cover-thumb" src="${coverSrc}" alt="${book.title} Cover Mockup">
      </div>
      <div class="book-main">
        <div class="meta">${label}${label ? " · " : ""}${collection.title}</div>
        <h3>${book.title}</h3>
        <p>${blurb}</p>
      </div>
      <a class="buy" href="${book.link}" target="_blank" rel="noopener">Purchase Edition</a>
    </article>
  `;
}

function showcaseCard(item) {
  const coverSrc = item.book.image || "logo.png";
  return `
    <article class="showcase-card">
      <span class="showcase-badge" style="color: ${item.collection.colorA}">${item.collection.title}</span>
      <div class="showcase-cover-wrapper">
        <img class="showcase-cover-img" src="${coverSrc}" alt="${item.book.title} Cover Display">
      </div>
      <div>
        <h3>${item.book.title}</h3>
        <p>${item.book.blurb || 'Curated structural workspace.'}</p>
      </div>
      <a class="buy" href="${item.book.link}" target="_blank" rel="noopener">Purchase Now</a>
    </article>
  `;
}

function editorialSpreadCard(num, key, collection) {
  const intro = collection.intro || (collection.subsections[0] ? collection.subsections[0].intro : "Explore our curated collection");
  return `
    <article class="editorial-spread" onclick="navigate('${key}')" role="button" tabindex="0">
      <div class="spread-num" style="color: var(--ink); opacity: 0.15;">${num}</div>
      <div class="spread-title-wrap">
        <div class="spread-accent" style="background: linear-gradient(to bottom, ${collection.colorA}, ${collection.colorB})"></div>
        <h3>${collection.title}</h3>
      </div>
      <p>${intro}</p>
      <span class="editorial-link">Explore Shelf Collection →</span>
    </article>
  `;
}

function getFeaturedBooks() {
  const targets = [
    { title: "When We First Collided", key: "romance" },
    { title: "Rebooting Raya", key: "indian" },
    { title: "How to Drive Manifestation", key: "selfhelp" },
    { title: "Best Sister Diary", key: "diaries" }
  ];
  
  return targets.map(t => {
    const collection = DATA[t.key];
    const bookMatch = collection.subsections.flatMap(sub => sub.books).find(b => b.title.toLowerCase() === t.title.toLowerCase());
    return bookMatch ? { book: bookMatch, collection: collection } : null;
  }).filter(item => item !== null);
}

function allBooks() {
  return [
    ...DATA.romance.subsections.flatMap(sub => sub.books.map(book => ({ book, collection: DATA.romance, subsection: sub }))),
    ...DATA.indian.subsections.flatMap(sub => sub.books.map(book => ({ book, collection: DATA.indian, subsection: sub }))),
    ...DATA.selfhelp.subsections.flatMap(sub => sub.books.map(book => ({ book, collection: DATA.selfhelp, subsection: sub }))),
    ...DATA.diaries.subsections.flatMap(sub => sub.books.map(book => ({ book, collection: DATA.diaries, subsection: sub })))
  ];

/* Master Shelf renderer */
function shelfSection(title, intro, collection, isDetail = false) {
  let html = ``;
  
  if (!isDetail) {
    html += `
      <section style="margin-bottom: 56px;">
        <div class="section-head">
          <div>
            <h2>${title}</h2>
            ${intro ? `<p>${intro}</p>` : ''}
          </div>
          <div class="count">${collection.subsections.reduce((sum, sub) => sum + sub.books.length, 0)} titles</div>
        </div>`;
  }

  collection.subsections.forEach(subsection => {
    const showSubHeader = subsection.title && (!isDetail || collection.subsections.length > 1 || subsection.title !== collection.title);
    
    html += `<div style="margin-bottom: 48px;">
      ${showSubHeader ? `
        <div class="subsection-header" style="border-left-color: ${collection.colorB};">
          <h3 class="subsection-title">${subsection.title}</h3>
          ${subsection.intro ? `<p class="subsection-intro">${subsection.intro}</p>` : ''}
        </div>
      ` : ''}
      <div class="books-grid">
        ${subsection.books.map(book => bookRow(book, collection, subsection)).join("")}
      </div>
    </div>`;
  });
  
  if (!isDetail) html += `</section>`;
  return html;
}

function renderShelf(filter = "all") {
  setActive("shelf");
  const collections = {
    all: [DATA.romance, DATA.indian, DATA.selfhelp, DATA.diaries],
    romance: [DATA.romance],
    indian: [DATA.indian],
    selfhelp: [DATA.selfhelp],
    diaries: [DATA.diaries]
  };
  const selectedCollections = collections[filter] || collections.all;

  let shelves = selectedCollections.map(collection => 
    shelfSection(collection.title, collection.intro, collection, false)
  ).join("");

  view.innerHTML = `
    <section class="shelf-layout">
      <aside class="filter-panel">
        <h2>Shelf</h2>
        <button class="${filter === "all" ? "active" : ""}" onclick="renderShelf('all')">All Books</button>
        <button class="${filter === "romance" ? "active" : ""}" onclick="renderShelf('romance')">Romance</button>
        <button class="${filter === "indian" ? "active" : ""}" onclick="renderShelf('indian')">Indian</button>
        <button class="${filter === "selfhelp" ? "active" : ""}" onclick="renderShelf('selfhelp')">Self Help</button>
        <button class="${filter === "diaries" ? "active" : ""}" onclick="renderShelf('diaries')">Diaries</button>
      </aside>
      <div>
        ${shelves}
      </div>
    </section>
  `;
}

function renderCollection(key) {
  const collection = DATA[key];
  setActive(key);
  view.innerHTML = `
    <div class="back" onclick="navigate('home')" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" style="fill: var(--ink); width: 14px; height: 14px; vertical-align: middle; margin-right: 6px;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Return to Library</div>
    <section class="detail-hero">
      <div>
        <h1>${collection.title}</h1>
        ${collection.intro ? `<p class="lead">${collection.intro}</p>` : ''}
      </div>
      <div class="count">${collection.subsections.reduce((sum, sub) => sum + sub.books.length, 0)} items</div>
    </section>
    ${shelfSection(collection.title, "", collection, true)}
  `;
}

function router() {
  triggerViewRefresh();
  const route = location.hash.replace("#/", "") || "home";
  if (route === "shelf") renderShelf();
  else if (route === "romance" || route === "indian" || route === "selfhelp" || route === "diaries") renderCollection(route);
  else renderHome();
  window.scrollTo(0, 0);
}

/* PWA App Install Banner trigger */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById('pwaBanner');
  if (banner && !localStorage.getItem('pwaPromptDismissed')) {
    banner.style.display = 'flex';
  }
});

function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      closePwaBanner();
    });
  } else {
    alert("To add this site as an app:\n- On Safari/iOS: Tap 'Share' > 'Add to Home Screen'\n- On Android/Chrome: Tap menu (⋮) > 'Install app' / 'Add to Home screen'");
  }
}

function closePwaBanner() {
  const banner = document.getElementById('pwaBanner');
  if (banner) banner.style.display = 'none';
  localStorage.setItem('pwaPromptDismissed', 'true');
}

window.addEventListener("hashchange", router);
router();
</script>
